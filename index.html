import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#1a1a20"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "app"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/app
    appdir.mkdir()


    # unpack filesystem from the compressed archive into the work dir. The
    # .apk is a zip, and zipfile is in every runtime -- the archived 0.9
    # runtime ships without tarfile, and the .tar.gz path died on it (10-02)
    import zipfile
    async with platform.fopen("app.apk", "rb") as archive:
        with zipfile.ZipFile(archive) as zip_ref:
            zip_ref.extractall(appdir.as_posix())

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Tap or click to start Chessmania"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

// progress beacons: the page reports what it is doing to the server's
// log (/_ping/... is answered 204), so a load that stalls on someone
// else's browser can be read there without a screenshot (09-27)
(function () {
  var t0 = Date.now();
  // only the dev server (web/serve.py) answers the beacon; on a static
  // host (GitHub Pages, 10-14) it would 404 at the site root, so there it
  // goes to the console instead -- the same line, readable in devtools
  var dev = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  function ping(what) {
    var line = Math.round((Date.now() - t0) / 1000) + "s " + what;
    if (!dev) { try { console.log("chessmania: " + line); } catch (e) {} return; }
    try { fetch("/_ping/" + encodeURIComponent(line), {cache: "no-store"}); } catch (e) {}
  }
  window.chessmaniaPing = ping;
  ping("html parsed  " + navigator.userAgent.slice(0, 80));
  // A LOCAL test server (web/serve.py) takes a copy of the saved run, so a
  // "the fight won't start" on someone's browser can be replayed exactly
  // (10-03). Only to 127.0.0.1 -- a hosted page never sends anything.
  if (location.hostname === "127.0.0.1") {
    try {
      var saves = {};
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf("chessmania") >= 0) saves[k] = localStorage.getItem(k);
      }
      fetch("/_save", {method: "POST", body: JSON.stringify(saves)});
    } catch (e) {}
  }
  window.addEventListener("error", function (e) {
    ping("JS ERROR " + (e.message || "") + " @" + ((e.filename || "").split("/").pop()) + ":" + e.lineno);
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    ping("PROMISE REJECTED " + String(e.reason).slice(0, 160));
  });
  var site = document.getElementById("site");
  if (site) site.addEventListener("error", function () { ping("pythons.js FAILED TO LOAD"); });
  var last = "";
  setInterval(function () {
    var box = document.getElementById("infobox");
    var text = box ? (box.innerText || "").trim().slice(0, 100) : "(no infobox)";
    var canvas = document.getElementById("canvas");
    var shown = canvas && canvas.width > 0 && !canvas.hidden ? " canvas=" + canvas.width + "x" + canvas.height : " no-canvas";
    var line = "box: " + text + shown + " hidden=" + (box ? box.hidden : "?");
    if (line !== last) { last = line; ping(line); }
  }, 5000);
})();
